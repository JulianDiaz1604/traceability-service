server:
  port: 8084

spring:
  application:
    name: traceability-service

dynamodb:
  region: ${AWS_REGION:us-east-1}
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
  access-key: ${AWS_ACCESS_KEY_ID:local}
  secret-key: ${AWS_SECRET_ACCESS_KEY:local}
  table-name: ${DYNAMODB_TABLE:order_traces}

food-court-service:
  base-url: ${FOOD_COURT_SERVICE_URL:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET:change-me-plazoleta-shared-jwt-secret-key-32bytes-min}

appDescription: "traceability-service - Plazoleta de comidas (PRAGMA)"
appVersion: "1.0.0"
