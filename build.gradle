plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
}

group = 'com.pragma'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    mapstructVersion = '1.6.3'
    lombokMapstructBindingVersion = '0.2.0'
    springdocVersion = '2.8.3'
    jjwtVersion = '0.12.6'
    awsSdkVersion = '2.28.29'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // NOTE: spring-boot-devtools is intentionally omitted. Its RestartClassLoader is incompatible
    // with the DynamoDB Enhanced Client's cached TableSchema (ClassCastException on the entity bean
    // across classloaders at putItem time).

    // DynamoDB (AWS SDK v2 Enhanced Client) — traceability datastore.
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:dynamodb-enhanced'

    // JWT (JJWT) — verifies tokens issued by users-service using the shared secret.
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok'

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Architecture rules as unit tests (fails the build on a boundary violation).
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// --- Architecture-only test task (fast feedback for the pre-commit hook) ---
tasks.register('archTest', Test) {
    group = 'verification'
    description = 'Runs only the ArchUnit architecture rules.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.pragma.traceability.architecture.*'
    }
}

// --- Install versioned git hooks so every commit validates architecture ---
tasks.register('installGitHooks') {
    group = 'git hooks'
    description = 'Points git at config/git-hooks so each commit validates architecture (archTest).'
    onlyIf { file('.git').exists() }
    doLast {
        exec { commandLine 'git', 'config', 'core.hooksPath', 'config/git-hooks' }
        file('config/git-hooks/pre-commit').setExecutable(true)
        logger.lifecycle('Git hooks installed -> config/git-hooks')
    }
}

// Self-install the hooks on every build (no-op when there is no .git, e.g. CI checkout).
tasks.named('build') { dependsOn 'installGitHooks' }
